<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-vindo ao CorporateFlix</title>
  <link rel="stylesheet" href="conteudo.css">

</head>
<body class="corpo-conteudo">

  <div class="tela-boas-vindas">
    <!-- Vídeo ambiente sem áudio, em loop e sem controles -->

      class="video-ambiente"
      autoplay
      muted
      loop
      playsinline
      disablepictureinpicture>
      <source src="video-infinito.mp4" type="video/mp4">
    </video>

    <div class="sobreposicao-texto">
      <h2>Bem-vindo ao CorporateFlix</h2>
      <p>Sua jornada de desenvolvimento começa aqui. Escolha um treinamento no menu ao lado.</p>
    </div>
  </div>

</html>
